name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --all-extras --dev --locked

      - name: Lint
        run: uv run ruff check quire tests

      - name: Typecheck
        run: uv run pyright quire

      - name: Test
        run: uv run pytest

      - name: Build package
        run: uv build
