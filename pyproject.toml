[project]
name = "quire"
version = "0.1.0"
description = "Typed schema-aware document storage on git objects, refs, and notes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dulwich>=1.1.0",
    "msgspec>=0.19.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quire"]

[tool.pytest.ini_options]
timeout = 300
timeout_method = "thread"
